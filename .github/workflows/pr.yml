name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, milestoned, demilestoned]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false

  hygiene:
    # bot PRs (dependabot) carry no milestone or issue — exempt
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a milestone
        if: github.event.pull_request.milestone == null
        run: |
          echo "::error::Set a milestone on this PR (M0–M9)."
          exit 1
      - name: Require a linked issue
        env:
          TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          echo "$TEXT" | grep -qiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed)) #[0-9]+' || {
            echo "::error::Link the issue with 'Closes #N' in the PR body."
            exit 1
          }
