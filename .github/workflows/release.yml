name: release

# main moves only when a release cuts from dev, so a push to main *is* the release
# trigger: verify, then let semantic-release read the commits since the last tag, pick
# the version, tag it, build the bundle stamped with that exact tag (its own `prepare`
# step, .releaserc.yml), and publish the GitHub release with the bundle attached.
# Config lives in .releaserc.yml; flow in docs/releasing.md.

on:
  push:
    branches: [main]

# semantic-release pushes the tag and creates the release — contents is the only
# scope it needs; issue/PR commenting is switched off in .releaserc.yml.
permissions:
  contents: write

# ${(m)#…} width accounting counts bytes, not cells, outside a UTF-8 locale —
# pin one so every job measures the same thing (the 5.8 container defaults to C).
env:
  LC_ALL: C.UTF-8

jobs:
  # The gate: the locally-runnable suite, same steps as ci.yml's test job. The full
  # ci workflow (installer, ui, golden, perf, zsh 5.8) runs on the same push; this
  # job exists so a release can never outrun the basics even while ci is queued.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install ShellSpec
        run: |
          git clone --depth 1 https://github.com/shellspec/shellspec.git "$HOME/.shellspec-src"
          echo "$HOME/.shellspec-src" >> "$GITHUB_PATH"
      - name: Guard against a silent skip
        run: zsh tools/spec-guard.zsh
      - name: L1 unit + L2 render
        run: shellspec test/unit test/render

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Full history — semantic-release walks every commit since the last tag to
      # compute the version, and a shallow clone would hide them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Needed here, not just by semantic-release's own `prepare` step below: `make
      # bundle` runs zsh, and that step runs inside the same job, on the same runner.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # npx with pinned versions, no package.json — the repo is zsh and this is the
      # whole node footprint. The preset package rides along because the analyzer
      # loads it at runtime, and @semantic-release/exec the same way for its own
      # `prepare` step (.releaserc.yml) — the bundle is built there, after the
      # version is decided and before the GitHub release is published, never here.
      #
      # THE PRESET IS HELD AT 9, NOT LATEST, AND BUMPING IT SILENTLY BREAKS THE NOTES.
      # Issue #289. `conventional-changelog-conventionalcommits@10` is incompatible with
      # the `@semantic-release/release-notes-generator@14` that semantic-release@25
      # resolves, and it does not fail — it emits a body consisting of the compare-link
      # header and nothing else. Every automated release from v1.0.1 to v2.0.0 shipped
      # 87 bytes of notes that way, which for this project means no changelog at all:
      # `docs/releasing.md` commits no CHANGELOG.md precisely because "the releases page
      # is the changelog".
      #
      # It went unnoticed for five releases because @semantic-release/commit-analyzer is
      # NOT affected — versions were always correct while the notes were always empty, so
      # neither half of the pipeline ever reported a problem. Driving the generator over
      # v2.0.0's own commits: 9.3.1 emits 601 bytes with the breaking changes and features
      # grouped; 10.2.1 emits 86.
      #
      # Falling back to the default angular preset is NOT a substitute. Its header pattern
      # does not match the `!` breaking marker, so `feat(config)!: …` is dropped from the
      # notes entirely — and one line, no body, `!` for breaking IS our commit convention
      # (CONVENTIONS.md), so the conventionalcommits preset is load-bearing here.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          --package semantic-release@25.0.8
          --package conventional-changelog-conventionalcommits@9.3.1
          --package @semantic-release/exec@7.1.0
          semantic-release
