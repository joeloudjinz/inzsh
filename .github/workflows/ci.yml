name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

# Fail fast, cheapest first — CI is the only feedback loop for jobs that
# can't run natively on the dev machine (zsh 5.8, installer tests, full parity).

# ${(m)#…} width accounting counts bytes, not cells, outside a UTF-8 locale —
# pin one so every job measures the same thing (the 5.8 container defaults to C).
env:
  LC_ALL: C.UTF-8

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: zsh -n over all zsh sources
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            found=1
            zsh -n "$f" || exit 1
            echo "ok: $f"
          done < <(find . -path ./.git -prune -o \( -name '*.zsh' -o -name '*.zsh-theme' \) -print)
          [ "$found" = 1 ] || echo "no zsh sources yet"

  test:
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install ShellSpec
        run: |
          git clone --depth 1 https://github.com/shellspec/shellspec.git "$HOME/.shellspec-src"
          echo "$HOME/.shellspec-src" >> "$GITHUB_PATH"
      - name: L1 unit + L2 render
        run: shellspec test/unit test/render

  # L3 terminal grid — pty + pyte. `make test-ui` skips itself when the venv is
  # absent, so this job builds one and then *proves* the suite ran: a green job
  # that silently tested nothing is worse than no job at all.
  ui:
    needs: syntax
    runs-on: ubuntu-latest
    # pty renders can wedge; fail fast rather than burn the default 360 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned L3 deps into .venv
        # .venv is exactly where the Makefile's default PYTHON ?= ./.venv/bin/python looks
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --requirement test/ui/requirements.txt
      - name: L3 terminal grid
        run: |
          set -o pipefail
          make test-ui 2>&1 | tee ui.log
      - name: Guard against a silent skip
        run: |
          grep -Eq '^Ran [1-9][0-9]* tests?' ui.log || {
            echo "::error::make test-ui reported no tests — the L3 suite skipped instead of running"
            exit 1
          }

  # zsh floor — 5.8 isn't available natively on the dev machine, so this job
  # is the only feedback loop for it. Matrix widens as the suite grows (M2+).
  zsh-floor:
    needs: syntax
    runs-on: ubuntu-latest
    container: zshusers/zsh:5.8
    steps:
      - name: Install job deps
        # the 5.8 image is debian buster (EOL) — its repos live on archive.debian.org now
        run: |
          printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y -qq git ncurses-term
      - uses: actions/checkout@v7
      - name: Install ShellSpec
        run: git clone --depth 1 https://github.com/shellspec/shellspec.git /opt/shellspec
      - name: L1 unit + L2 render under zsh 5.8
        run: /opt/shellspec/shellspec test/unit test/render
