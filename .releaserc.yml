# Release configuration. The release workflow (.github/workflows/release.yml) runs
# semantic-release against this on every push to main; nothing here runs locally.
#
# The conventionalcommits preset, not the default angular one — our commits are one
# line with no body, so breaking changes are marked with `!` (feat(config)!: …) and
# only this preset reads the `!`. feat → minor, fix → patch, `!` → major.
branches: [main]
tagFormat: v${version}
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  # No CHANGELOG.md committed back: that would need a bot commit pushed straight to
  # main, which the branch rules forbid. The generated notes live on the GitHub
  # release itself — the releases page is the changelog.
  #
  # Issue #244's version constant hits the same objection, resolved the same way — see
  # "The version constant" in docs/releasing.md. `nextRelease.gitTag` is the tag
  # `tagFormat` above just computed, reused rather than re-derived, so the stamp cannot
  # disagree with it.
  # The notes guard rides in front of the bundle rather than in a step of its own.
  # Issue #289: an incompatible preset version emits a body of nothing but the compare
  # header and does not fail, so five releases shipped with no notes and nothing in the
  # pipeline noticed. `###` is the section heading conventional-changelog writes for
  # every group it renders — no section means no commit was rendered, which is the bug's
  # exact signature. `indexOf` rather than a line count because the exec plugin compiles
  # these through lodash templates, which do NOT process escapes: `split('\n')` lands a
  # real newline inside a JS string literal and throws.
  #
  # `prepare` is the right step for it. It runs after the notes exist and before `tag()`,
  # so a bad release aborts without leaving a tag behind — the same property the bundle
  # build relies on, described under "How a release happens" in docs/releasing.md.
  - - "@semantic-release/exec"
    - prepareCmd: >-
        test ${nextRelease.notes.indexOf('###')} -ge 0
        || { echo 'release notes have no sections - see issue #289' >&2; exit 1; };
        INZSH_BUNDLE_VERSION=${nextRelease.gitTag} make bundle
  - - "@semantic-release/github"
    - assets:
        - path: dist/inzsh.zsh-theme
          label: inzsh.zsh-theme — single-file bundle
      # Keep GITHUB_TOKEN at contents:write only — no issue/PR comments, no labels.
      successComment: false
      failComment: false
      failTitle: false
      releasedLabels: false
